<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; base-uri 'none'; object-src 'none'; script-src 'self' qrc:; style-src 'self' qrc:; img-src 'self' qrc: data: blob: https://a.basemaps.cartocdn.com https://b.basemaps.cartocdn.com https://c.basemaps.cartocdn.com https://d.basemaps.cartocdn.com https://a.tile.opentopomap.org https://b.tile.opentopomap.org https://c.tile.opentopomap.org https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/ https://s3.amazonaws.com/elevation-tiles-prod/terrarium/; connect-src 'none'; font-src 'self' qrc:; media-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; form-action 'none'">
<title>CosmoSoft Flight Map</title>
<link rel="stylesheet" href="qrc:///map/leaflet.css" />
<script src="qrc:///map/leaflet.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<link rel="stylesheet" href="qrc:///map/map3d.css" />
</head>
<body>

<div id="mapContainer">
  <div id="map" role="region" aria-label="Interactive two-dimensional flight map"></div>
  <div id="view3d" role="region" aria-label="Interactive three-dimensional flight view"></div>
</div>
<div id="altProfile"><canvas id="altCanvas" role="img" aria-label="Altitude profile for the loaded flight"></canvas></div>

<div id="viewToggle" role="group" aria-label="Map view">
  <button type="button" class="vt-btn active" id="btn2D" aria-pressed="true">2D</button>
  <div class="vt-sep" aria-hidden="true"></div>
  <button type="button" class="vt-btn" id="btn3D" aria-pressed="false">3D</button>
</div>

<button type="button" id="btnLocate" class="map-btn" title="Center on rocket" aria-label="Center on rocket">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
    <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
  </svg>
</button>
<button type="button" id="btnFit" class="map-btn" title="Fit to full path" aria-label="Fit full flight path">Fit</button>
<button type="button" id="btnFollow" class="map-btn" title="Auto-follow rocket" aria-label="Auto-follow rocket" aria-pressed="false">F</button>
<button type="button" id="btnZoomIn" class="map-btn" title="Zoom in" aria-label="Zoom in">+</button>
<button type="button" id="btnZoomOut" class="map-btn" title="Zoom out" aria-label="Zoom out">&minus;</button>

<div id="layerSwitcher" role="group" aria-label="Two-dimensional base layer">
  <button type="button" class="ls-btn active" id="lsMap" aria-pressed="true">Map</button>
  <div class="ls-sep" aria-hidden="true"></div>
  <button type="button" class="ls-btn" id="lsTerrain" aria-pressed="false">Terrain</button>
  <div class="ls-sep" aria-hidden="true"></div>
  <button type="button" class="ls-btn" id="lsSat" aria-pressed="false">Satellite</button>
</div>

<div id="ground3dToggle" role="group" aria-label="Three-dimensional ground layer">
  <button type="button" class="ls-btn active" id="g3dBox" aria-pressed="true">Box</button>
  <div class="ls-sep" aria-hidden="true"></div>
  <button type="button" class="ls-btn" id="g3dMap" aria-pressed="false">Map</button>
  <div class="ls-sep" aria-hidden="true"></div>
  <button type="button" class="ls-btn" id="g3dTerrain" aria-pressed="false">Terrain</button>
  <div class="ls-sep" aria-hidden="true"></div>
  <button type="button" class="ls-btn" id="g3dSat" aria-pressed="false">Satellite</button>
</div>

<div id="statsOverlay" role="region" aria-label="Current flight position statistics" aria-live="off"></div>
<div id="info3d" role="region" aria-label="Three-dimensional map status" aria-live="off"></div>
<div id="providerAttribution" aria-label="Map data attribution"></div>

<script type="module" src="qrc:///map/map3d.js"></script>
</body>
</html>
